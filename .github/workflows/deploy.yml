name: Deploy to Production

# Триггер на push в main ветку
on:
  push:
    branches:
      - main
  workflow_dispatch:  # Позволяет запускать вручную

concurrency:
  group: onlinepolis-production
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_PROJECT_NAME: insurance_broker
  DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # Opt in to Node.js 24 for JavaScript actions to avoid Node 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose syntax
        run: |
          # Create temporary env file for validation.
          # POSTGRES_* нужны для interpolation в environment блоке web/celery_*.
          cp .env.prod.example .env.prod || touch .env.prod
          set -a
          # shellcheck disable=SC1091
          source .env.prod
          set +a

          docker compose --compatibility -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml config --quiet
          echo "✅ docker-compose.prod.yml syntax is valid"

          rm -f .env.prod

      - name: Check for required files
        run: |
          required_files=(
            "Dockerfile"
            "docker-compose.prod.yml"
            "entrypoint.sh"
            "requirements.prod.txt"
            "nginx/default.conf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file missing: $file"
              exit 1
            fi
          done
          echo "✅ All required files present"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # Тесты используют config.test_settings (SQLite, MD5-hasher, миграции отключены).
          # Эти переменные нужны только чтобы импорт config.settings не упал на проверке.
          SECRET_KEY: ci-test-secret-key-not-for-production  # pragma: allowlist secret
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          pytest --tb=short

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [validate, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t insurance-broker:latest .
          echo "✅ Docker image built successfully"

      - name: Verify image exists
        run: |
          echo "Checking if image exists..."
          docker images | grep insurance-broker
          echo "✅ Image verified"

      - name: Test Docker image
        run: |
          echo "Testing Docker image..."
          docker run --rm --entrypoint python insurance-broker:latest --version
          echo "✅ Docker image is functional"

  deploy:
    name: Deploy to Timeweb Cloud
    runs-on: ubuntu-latest
    needs: build
    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${DROPLET_HOST:-}" ] || [ -z "${DROPLET_USER:-}" ]; then
            echo "❌ Missing required deployment secrets (SSH_PRIVATE_KEY, DROPLET_HOST, DROPLET_USER)"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p "${SSH_PORT:-22}" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
          # Сборка без кэша на проде идёт 20+ минут: PyPI отдаёт ~20 КБ/с, и
          # pip подолгу молчит. Без keepalive простаивающую SSH-сессию рвёт
          # (22.10.2026: «client_loop: send disconnect: Broken pipe»), а buildx
          # при потере клиента отменяет сборку.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "✅ SSH configured"

      - name: Preflight SSH connectivity
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          echo "Network diagnostics for $DROPLET_HOST:${SSH_PORT:-22}"
          echo "--- DNS (all records via getent ahosts) ---"
          getent ahosts "$DROPLET_HOST" || true
          echo "--- IPv4 TCP probe ---"
          ipv4_list=$(getent ahostsv4 "$DROPLET_HOST" | awk '{print $1}' | sort -u || true)
          if [ -z "${ipv4_list:-}" ]; then
            echo "⚠️ No IPv4 addresses resolved for $DROPLET_HOST"
          else
            for ip in $ipv4_list; do
              if timeout 5 bash -lc "cat < /dev/null > /dev/tcp/$ip/${SSH_PORT:-22}" 2>/dev/null; then
                echo "✅ TCP reachable: $ip:${SSH_PORT:-22}"
              else
                echo "❌ TCP not reachable: $ip:${SSH_PORT:-22}"
              fi
            done
          fi
          echo "Checking SSH access to $DROPLET_HOST:${SSH_PORT:-22}"
          ssh -4 -i ~/.ssh/deploy_key \
              -p "${SSH_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=no \
              "$DROPLET_USER@$DROPLET_HOST" \
              "echo '✅ SSH connection established'; hostname"

      - name: Preflight Compose plugin and preserve running release
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" bash -s -- "$DEPLOYMENT_ID" << 'ENDSSH'
            set -euo pipefail
            deployment_id=$1
            [[ "$deployment_id" =~ ^[0-9]+-[0-9]+$ ]]
            compose_version=$(docker compose version --short)
            if [[ ! "$compose_version" =~ ^v?([0-9]+)\.([0-9]+) ]] ||
               (( BASH_REMATCH[1] < 2 || (BASH_REMATCH[1] == 2 && BASH_REMATCH[2] < 20) )); then
              echo "❌ Docker Compose plugin >= 2.20 is required (including newer major versions)"
              exit 1
            fi
            docker compose version
            docker info --format 'Docker Engine {{.ServerVersion}}'
            command -v curl > /dev/null
            command -v flock > /dev/null
            mkdir -p "$HOME/.local/state"
            exec 9> "$HOME/.local/state/onlinepolis-deploy.lock"
            flock -w 3600 9 || { echo "❌ Timed out waiting for the production deployment lock"; exit 1; }
            cd ~/insurance_broker
            set -a
            source .env.prod
            set +a
            export COMPOSE_PROJECT_NAME=insurance_broker
            docker compose --compatibility -p "$COMPOSE_PROJECT_NAME" --env-file .env.prod -f docker-compose.prod.yml config --quiet

            # Fail before rsync if the namespace does not match existing data.
            [[ "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' insurance_broker_db)" == "$COMPOSE_PROJECT_NAME" ]] || { echo "❌ Existing database belongs to a different Compose project"; exit 1; }
            for volume in postgres_data redis_data static_volume media_volume; do
              docker volume inspect "${COMPOSE_PROJECT_NAME}_${volume}" > /dev/null
            done
            umask 077
            release_dir="$HOME/.local/state/onlinepolis-deploy/$deployment_id"
            mkdir -p "$release_dir"
            cp docker-compose.prod.yml "$release_dir/docker-compose.prod.yml"
            cp -a nginx "$release_dir/nginx"
            printf 'services:\n' > "$release_dir/rollback.yml"
            : > "$release_dir/image-ids"
            for service in web celery_worker celery_beat; do
              image_id=$(docker inspect --format '{{.Image}}' "insurance_broker_$service")
              backup_tag="onlinepolis-rollback:${deployment_id}-${service}"
              docker image tag "$image_id" "$backup_tag"
              printf '  %s:\n    image: %s\n    entrypoint: ["gosu", "app"]\n' "$service" "$backup_tag" >> "$release_dir/rollback.yml"
              printf '%s %s\n' "$service" "$image_id" >> "$release_dir/image-ids"
            done
            touch "$release_dir/prepared"
            echo "✅ Compose plugin, existing project volumes and rollback images verified"
          ENDSSH

      - name: Copy files to server
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          # H-11: --delete — на сервере не остаётся файлов, удалённых из
          # репозитория (иначе там копились старые скрипты/шаблоны, а
          # удалённая из git миграция осталась бы и применилась).
          # Исключения ЗАЩИЩАЮТ от удаления всё, что живёт только на сервере:
          #   /.env, /.env.prod* — секреты (кроме .env.prod.example из репо);
          #   /certbot/ — SSL-сертификаты; /logs/ — логи (cron, django, nginx);
          #   /media/, /db.sqlite3 — данные. Новый серверный файл в корне
          #   проекта — сначала добавить сюда, иначе следующий деплой его удалит.
          # Пути с ведущим / привязаны к корню проекта.
          RSYNC_ARGS=(
            -avz --delete
            -e "ssh -4 -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no"
            --exclude='.git'
            --exclude='venv'
            --exclude='black_venv'
            --exclude='__pycache__'
            --exclude='*.pyc'
            --exclude='/.env'
            --include='/.env.prod.example'
            --exclude='/.env.prod*'
            --exclude='/db.sqlite3'
            --exclude='/certbot/'
            --exclude='/logs/'
            --exclude='/media/'
            ./ "$DROPLET_USER@$DROPLET_HOST:~/insurance_broker/"
          )

          # Страховка от ошибки в исключениях: сначала dry-run, список
          # удаляемого — в лог CI; если туда попали секреты/сертификаты/
          # логи/данные — деплой останавливается, ничего не удалив.
          echo "🔍 rsync --delete dry-run:"
          rsync --dry-run "${RSYNC_ARGS[@]}" | grep '^deleting ' > /tmp/rsync-deletions.txt || true
          echo "Will delete $(wc -l < /tmp/rsync-deletions.txt) path(s) on server:"
          cat /tmp/rsync-deletions.txt
          if grep -E '^deleting (\.env($|\.prod)|certbot/|logs/|media/|db\.sqlite3$)' /tmp/rsync-deletions.txt; then
            echo "❌ rsync --delete would remove server-only data (see above) — aborting"
            exit 1
          fi

          rsync "${RSYNC_ARGS[@]}"
          echo "✅ Files copied to server (preserving credentials, certificates and logs)"

      - name: Verify env files on server
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" << 'ENDSSH'
            set -e
            cd ~/insurance_broker

            if [ ! -f .env.prod ]; then
              echo "❌ .env.prod not found!"
              echo "Please create it manually on the server before deploying"
              exit 1
            fi
            echo "✅ .env.prod exists (preserving existing credentials)"

            # PLAN 11.7: POSTGRES_* теперь живут в .env.prod (раньше — в .env.prod.db).
            # docker-compose.prod.yml interpolation требует чтобы POSTGRES_DB / USER /
            # PASSWORD были определены в .env.prod, иначе db не получит креды
            # и Django получит пустые DB_NAME/DB_USER/DB_PASSWORD через environment маппинг.
            for var in POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
              if ! grep -qE "^${var}=" .env.prod; then
                echo "❌ ${var} missing in .env.prod"
                echo "   Run on the server BEFORE deploy:"
                echo "   cat .env.prod.db >> .env.prod   # перенесёт 3 строки из старого файла"
                echo "   Then re-run the workflow."
                exit 1
              fi
            done
            echo "✅ POSTGRES_* present in .env.prod"

            # B-08: Django получает DB_* из POSTGRES_* (environment в compose),
            # но в .env.prod могут остаться старые строки DB_NAME/DB_USER/
            # DB_PASSWORD. Расхождение — ловушка при ручной правке: кто-то
            # меняет DB_PASSWORD, а работает POSTGRES_PASSWORD. Сравниваем
            # без вывода значений.
            env_value() { grep -E "^$1=" .env.prod | tail -1 | cut -d= -f2-; }
            check_same() {
              legacy=$1; main=$2
              if grep -qE "^${legacy}=" .env.prod && [ "$(env_value "$legacy")" != "$(env_value "$main")" ]; then
                echo "❌ ${legacy} differs from ${main} in .env.prod"
                echo "   Django uses ${main}; make ${legacy} equal to it or remove the ${legacy} line."
                exit 1
              fi
            }
            check_same DB_NAME POSTGRES_DB
            check_same DB_USER POSTGRES_USER
            check_same DB_PASSWORD POSTGRES_PASSWORD
            echo "✅ DB_* in .env.prod match POSTGRES_*"
          ENDSSH

      - name: Check SSL certificates
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          SSL_STATUS=$(ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" << 'ENDSSH'
            cd ~/insurance_broker

            # Check if SSL certificates exist
            if [ -d "certbot/conf/live/polis.insflow.ru" ]; then
              echo "✅ SSL certificates found"
              echo "true"
            else
              echo "⚠️  SSL certificates not found - will use initial config"

              # Backup SSL config and use initial config
              if [ -f "nginx/default.conf" ]; then
                cp nginx/default.conf nginx/default.conf.ssl
                cp nginx/default.conf.initial nginx/default.conf
                echo "✅ Switched to initial nginx config (no SSL)"
              fi
              echo "false"
            fi
          ENDSSH
          )

          # Extract the last line (true/false) from the output
          SSL_EXISTS=$(echo "$SSL_STATUS" | tail -n 1)
          echo "SSL_EXISTS=$SSL_EXISTS" >> $GITHUB_ENV
          echo "SSL certificates status: $SSL_EXISTS"

      - name: Deploy on server
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" bash -s -- "$DEPLOYMENT_ID" << 'ENDSSH'
            set -euo pipefail
            cd ~/insurance_broker
            set -a
            source .env.prod
            set +a
            export COMPOSE_PROJECT_NAME=insurance_broker
            release_dir="$HOME/.local/state/onlinepolis-deploy/$1"
            # A remote shell may survive a lost SSH connection. Recovery uses
            # this same host lock before restoring any files or containers.
            exec 9> "$HOME/.local/state/onlinepolis-deploy.lock"
            flock -w 3600 9 || { echo "❌ Timed out waiting for the production deployment lock"; exit 1; }
            test -f "$release_dir/prepared"
            compose=(docker compose --compatibility -p "$COMPOSE_PROJECT_NAME" --env-file .env.prod -f docker-compose.prod.yml)

            # Existing infrastructure images/containers remain in place. Build
            # every application image before changing any running service.
            echo "🔨 Building new images (old containers keep serving)..."
            rm -f apps/policies/migrations/0011_alter_paymentschedule_unique_together.py
            "${compose[@]}" build web celery_worker celery_beat < /dev/null
            : > "$release_dir/new-image-ids"
            for service in web celery_worker celery_beat; do
              image_id=$(docker image inspect --format '{{.Id}}' "insurance_broker_${service}:latest")
              printf '%s %s\n' "$service" "$image_id" >> "$release_dir/new-image-ids"
            done

            echo "🔧 Removing the known obsolete migration record..."
            # SSH passes this shell script on stdin. Disable stdin attachment
            # explicitly: otherwise Compose can consume the remaining script.
            "${compose[@]}" exec -T --interactive=false db psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              DELETE FROM django_migrations
              WHERE app = 'policies'
                AND name = '0011_alter_paymentschedule_unique_together';
            " < /dev/null

            # Application entrypoint is gosu/app: migrations and static collection
            # run once here, not concurrently in web and both Celery containers.
            echo "🔄 Running database migrations with the new image..."
            "${compose[@]}" run --rm -T --interactive=false --no-deps --pull never web python manage.py migrate --noinput < /dev/null
            echo "📦 Collecting static files..."
            "${compose[@]}" run --rm -T --interactive=false --no-deps --pull never web python manage.py collectstatic --noinput < /dev/null

            # A fresh one-off container sees the new rsynced configuration inode.
            "${compose[@]}" run --rm -T --interactive=false --no-deps --pull never nginx nginx -t < /dev/null
            touch "$release_dir/activating"
            echo "🚀 Recreating application services, preserving database/Redis/certbot..."
            "${compose[@]}" up -d --no-deps --no-build --pull never --wait --wait-timeout 180 web celery_worker celery_beat < /dev/null

            # Recreate nginx to rebind replaced config files and resolve the new
            # web container IP; reload alone cannot replace a bind-mounted inode.
            "${compose[@]}" up -d --no-deps --no-build --pull never --force-recreate --wait --wait-timeout 90 nginx < /dev/null
            "${compose[@]}" exec -T --interactive=false nginx nginx -t < /dev/null
            "${compose[@]}" exec -T --interactive=false nginx nginx -s reload < /dev/null
            while read -r service expected_id; do
              actual_id=$(docker inspect --format '{{.Image}}' "insurance_broker_$service")
              [[ "$actual_id" == "$expected_id" ]] || { echo "❌ Expected new image is not running: $service"; exit 1; }
            done < "$release_dir/new-image-ids"
            touch "$release_dir/switched"
            echo "✅ Application switched; final health and HTTPS checks follow"
          ENDSSH

      - name: Setup SSL (first deployment only)
        if: env.SSL_EXISTS == 'false'
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" << 'ENDSSH'
            set -e
            cd ~/insurance_broker

            echo "🔐 Setting up SSL certificates..."
            echo "⚠️  This is a first deployment - SSL setup required"
            echo ""
            echo "Please run the following command on the server:"
            echo "  cd ~/insurance_broker && ./scripts/setup-ssl.sh"
            echo ""
            echo "Or manually:"
            echo "  1. Verify DNS is configured: nslookup polis.insflow.ru"
            echo "  2. Run: docker compose -p insurance_broker --env-file .env.prod -f docker-compose.prod.yml run --rm certbot certonly --webroot --webroot-path=/var/www/certbot --email admin@insflow.ru --agree-tos --no-eff-email -d polis.insflow.ru"
            echo "  3. Switch to SSL config: cp nginx/default.conf.ssl nginx/default.conf"
            echo "  4. Recreate nginx: docker compose -p insurance_broker --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps --no-build --pull never --force-recreate nginx"
          ENDSSH

      - name: Health check
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" bash -s -- "$DEPLOYMENT_ID" << 'ENDSSH'
            set -euo pipefail
            cd ~/insurance_broker
            set -a
            source .env.prod
            set +a
            export COMPOSE_PROJECT_NAME=insurance_broker
            release_dir="$HOME/.local/state/onlinepolis-deploy/$1"
            exec 9> "$HOME/.local/state/onlinepolis-deploy.lock"
            flock -w 3600 9 || { echo "❌ Timed out waiting for the production deployment lock"; exit 1; }
            compose=(docker compose --compatibility -p "$COMPOSE_PROJECT_NAME" --env-file .env.prod -f docker-compose.prod.yml)

            # A healthy old release must never make an incomplete deploy green.
            test -f "$release_dir/activating"
            test -f "$release_dir/switched"
            test "$(wc -l < "$release_dir/new-image-ids")" -eq 3
            while read -r service expected_id; do
              case "$service" in web|celery_worker|celery_beat) ;; *) exit 1 ;; esac
              actual_id=$(docker inspect --format '{{.Image}}' "insurance_broker_$service")
              [[ "$actual_id" == "$expected_id" ]] || { echo "❌ Running image differs from this release: $service"; exit 1; }
            done < "$release_dir/new-image-ids"

            echo "🏥 Checking every production service..."
            for service in db redis web celery_worker celery_beat nginx certbot; do
              container_id=$("${compose[@]}" ps -q "$service")
              test -n "$container_id"
              state=$(docker inspect --format '{{.State.Status}}' "$container_id")
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")
              echo "$service: state=$state health=$health"
              [[ "$state" == running ]] || { echo "❌ Service is not running: $service"; exit 1; }
              case "$service" in
                celery_beat|certbot) [[ "$health" == none || "$health" == healthy ]] || { echo "❌ Unhealthy service: $service"; exit 1; } ;;
                *) [[ "$health" == healthy ]] || { echo "❌ Health check failed: $service"; exit 1; } ;;
              esac
            done

            login_page=$(curl --fail --silent --show-error --max-time 20 --resolve polis.insflow.ru:443:127.0.0.1 https://polis.insflow.ru/accounts/login/)
            [[ "$login_page" == *'name="username"'* && "$login_page" == *'name="password"'* ]] || { echo "❌ HTTPS response does not contain the login form"; exit 1; }
            unset login_page
            touch "$release_dir/verified"
            echo "✅ All service healthchecks and HTTPS login page passed"

            # Rollback images have immutable per-run tags and survive pruning.
            docker image prune -f || true
            docker volume prune -f || true
            docker builder prune -f --filter until=168h || true
          ENDSSH

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [validate, test, build, deploy]
    if: always()

    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment to production was successful!"
          echo "🌐 Application should be available at https://polis.insflow.ru"

      - name: Deployment Failure
        if: needs.deploy.result == 'failure' || needs.build.result == 'failure' || needs.test.result == 'failure' || needs.validate.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."

  rollback:
    name: Restore Saved Application Images on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Setup SSH for rollback
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p "${SSH_PORT:-22}" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
          # Сборка без кэша на проде идёт 20+ минут: PyPI отдаёт ~20 КБ/с, и
          # pip подолгу молчит. Без keepalive простаивающую SSH-сессию рвёт
          # (22.10.2026: «client_loop: send disconnect: Broken pipe»), а buildx
          # при потере клиента отменяет сборку.
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 10\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Restore saved images and nginx configuration
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=no "$DROPLET_USER@$DROPLET_HOST" bash -s -- "$DEPLOYMENT_ID" << 'ENDSSH'
            set -euo pipefail
            cd ~/insurance_broker
            release_dir="$HOME/.local/state/onlinepolis-deploy/$1"
            mkdir -p "$HOME/.local/state"
            exec 9> "$HOME/.local/state/onlinepolis-deploy.lock"
            flock -w 3600 9 || { echo "❌ Timed out waiting for the production deployment lock"; exit 1; }
            if [ ! -f "$release_dir/prepared" ]; then
              echo "Preflight did not finish; no release files or containers were changed"
              exit 0
            fi
            if [ -f "$release_dir/verified" ]; then
              echo "Release already passed health checks; no image rollback required"
              exit 0
            fi

            cp "$release_dir/docker-compose.prod.yml" docker-compose.prod.yml
            cp -a "$release_dir/nginx/." nginx/
            # A failed/partial build can already have replaced :latest tags.
            # Restore those too, so later ordinary Compose commands stay on
            # the recovered release rather than recreating failed new images.
            while read -r service expected_id; do
              docker image tag "$expected_id" "insurance_broker_${service}:latest"
            done < "$release_dir/image-ids"
            if [ ! -f "$release_dir/activating" ]; then
              echo "Deployment failed before application switch; restored compose/nginx files and image tags, old containers kept running"
              echo "Database migrations, if applied, have not been reversed"
              exit 0
            fi

            set -a
            source .env.prod
            set +a
            export COMPOSE_PROJECT_NAME=insurance_broker
            compose=(docker compose --compatibility -p "$COMPOSE_PROJECT_NAME" --env-file .env.prod -f docker-compose.prod.yml -f "$release_dir/rollback.yml")

            # Only the three app containers and nginx are replaced. Saved image
            # tags preserve the actual running hotfix image, even after a build.
            "${compose[@]}" up -d --no-deps --no-build --pull never --force-recreate --wait --wait-timeout 180 web celery_worker celery_beat < /dev/null
            "${compose[@]}" up -d --no-deps --no-build --pull never --force-recreate --wait --wait-timeout 90 nginx < /dev/null
            "${compose[@]}" exec -T --interactive=false nginx nginx -t < /dev/null
            "${compose[@]}" exec -T --interactive=false nginx nginx -s reload < /dev/null

            while read -r service expected_id; do
              actual_id=$(docker inspect --format '{{.Image}}' "insurance_broker_$service")
              [[ "$actual_id" == "$expected_id" ]] || { echo "❌ Saved image was not restored: $service"; exit 1; }
            done < "$release_dir/image-ids"
            login_page=$(curl --fail --silent --show-error --max-time 20 --resolve polis.insflow.ru:443:127.0.0.1 https://polis.insflow.ru/accounts/login/)
            [[ "$login_page" == *'name="username"'* && "$login_page" == *'name="password"'* ]] || { echo "❌ Restored service did not return the login form"; exit 1; }
            unset login_page
            touch "$release_dir/restored"

            echo "🔄 Saved application image IDs and nginx configuration restored; HTTPS login verified"
            echo "Database migrations were NOT reversed; schema compatibility may require manual recovery"
          ENDSSH

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Report failed deployment
        run: |
          echo "⚠️ Deployment failed. See the recovery step for the verified image/configuration restore result."
          echo "Database migrations are never automatically reversed."
          exit 1
