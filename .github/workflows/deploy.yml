name: Deploy to Production

# Триггер на push в main ветку
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      activate:
        description: 'Activate production after building (disable for a maintenance release)'
        type: boolean
        required: true
        default: true

concurrency:
  group: onlinepolis-production
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  COMPOSE_PROJECT_NAME: insurance_broker
  DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # Opt in to Node.js 24 for JavaScript actions to avoid Node 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose syntax
        run: |
          # Create temporary env file for validation.
          # POSTGRES_* нужны для interpolation в environment блоке web/celery_*.
          cp .env.prod.example .env.prod || touch .env.prod
          set -a
          # shellcheck disable=SC1091
          source .env.prod
          set +a

          docker compose --compatibility -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml config --quiet
          echo "✅ docker-compose.prod.yml syntax is valid"

          rm -f .env.prod

      - name: Check for required files
        run: |
          required_files=(
            "Dockerfile"
            "docker-compose.prod.yml"
            "entrypoint.sh"
            "requirements.prod.txt"
            "nginx/default.conf"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file missing: $file"
              exit 1
            fi
          done
          echo "✅ All required files present"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # Тесты используют config.test_settings (SQLite, MD5-hasher, миграции отключены).
          # Эти переменные нужны только чтобы импорт config.settings не упал на проверке.
          SECRET_KEY: ci-test-secret-key-not-for-production  # pragma: allowlist secret
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          pytest --tb=short

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [validate, test]
    env:
      IMAGE_REF: insurance-broker:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      image-artifact-id: ${{ steps.upload-image.outputs.artifact-id }}
      image-artifact-name: ${{ steps.export-image.outputs.artifact-name }}
      image-ref: ${{ steps.export-image.outputs.image-ref }}
      config-digest: ${{ steps.export-image.outputs.config-digest }}
      archive-sha256: ${{ steps.export-image.outputs.archive-sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image once
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --provenance=false --load \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/image-build.json" -t "$IMAGE_REF" .

      - name: Verify image exists
        run: |
          docker image inspect --format '{{.Id}} {{.Os}}/{{.Architecture}}' "$IMAGE_REF"

      - name: Test Docker image
        run: |
          echo "Testing Docker image..."
          docker run --rm --entrypoint python "$IMAGE_REF" --version
          echo "✅ Docker image is functional"

      - name: Smoke test Redis broker transport
        run: |
          set -euo pipefail
          broker_network="onlinepolis-broker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          broker_redis="${broker_network}-redis"
          cleanup() {
            docker rm -fv "$broker_redis" > /dev/null 2>&1 || true
            docker network rm "$broker_network" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$broker_network" > /dev/null
          docker run -d --name "$broker_redis" --network "$broker_network" --network-alias broker-redis redis:7-alpine > /dev/null
          docker run --rm --network "$broker_network" --entrypoint python "$IMAGE_REF" -c '
          from kombu import Connection
          with Connection("redis://broker-redis:6379/0") as connection:
              connection.ensure_connection(max_retries=15, interval_start=0.2, interval_step=0.2, interval_max=1)
              with connection.SimpleQueue("ci-broker-smoke") as queue:
                  payload = {"broker_smoke": True}
                  queue.put(payload, serializer="json")
                  message = queue.get(block=True, timeout=5)
                  assert message.payload == payload, "Broker message round trip failed"
                  message.ack()
          print("Redis broker publish/consume smoke test passed")'

      - name: Smoke test PostgreSQL migrations in production image
        env:
          SECRET_KEY: ci-database-bootstrap-smoke-only-placeholder-2026-no-live-credentials  # pragma: allowlist secret
        run: |
          set -euo pipefail
          database_network="onlinepolis-database-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database_container="${database_network}-postgres"
          cleanup() {
            docker rm -fv "$database_container" > /dev/null 2>&1 || true
            docker network rm "$database_network" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$database_network" > /dev/null
          # Disposable DB, no published ports or production credentials/data.
          docker run -d --name "$database_container" --network "$database_network" \
            --network-alias bootstrap-postgres -e POSTGRES_DB=bootstrap \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:15-alpine > /dev/null
          ready=false
          for attempt in {1..30}; do
            if docker exec "$database_container" pg_isready -h 127.0.0.1 -U postgres -d bootstrap > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready"
          docker run --rm -i --network "$database_network" --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e DJANGO_SETTINGS_MODULE=config.settings -e DEBUG=False \
            -e SECRET_KEY \
            -e ALLOWED_HOSTS=bootstrap.invalid -e DB_NAME=bootstrap -e DB_USER=postgres \
            -e DB_PASSWORD=unused-ci-only -e DB_HOST=bootstrap-postgres \
            -e EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend \
            -e SENTRY_DSN= -e TELEGRAM_ENABLED=false -e VK_ENABLED=false \
            -e COMMUNICATIONS_EMAIL_ENABLED=false \
            -e CELERY_BROKER_URL=memory:// -e CELERY_RESULT_BACKEND=cache+memory:// \
            --entrypoint python "$IMAGE_REF" - <<'PY'
          import django
          django.setup()
          from django.core.management import call_command
          from django.db import connection
          from django.db.migrations.executor import MigrationExecutor
          from apps.insurers.models import Branch, InsuranceType, LeasingManager

          assert connection.vendor == "postgresql"
          assert not connection.introspection.table_names(), "Smoke DB must be empty"
          call_command("check", deploy=True, fail_level="WARNING")
          call_command("migrate", interactive=False, verbosity=0)
          assert not Branch.objects.exists() and not LeasingManager.objects.exists()
          for _ in range(2):
              call_command("loaddata", "fixtures/initial_data.json", verbosity=0)
              assert Branch.objects.count() == 4
              assert InsuranceType.objects.count() == 4
              assert list(InsuranceType.objects.filter(is_osago=True).values_list("name", flat=True)) == ["ОСАГО"]
              assert not LeasingManager.objects.exists()
              call_command("migrate", interactive=False, verbosity=0)
          executor = MigrationExecutor(connection)
          assert not executor.migration_plan(executor.loader.graph.leaf_nodes())
          call_command("makemigrations", check=True, dry_run=True)
          call_command("collectstatic", interactive=False, verbosity=0)
          print(f"PostgreSQL {connection.pg_version}: bootstrap/static checks passed on Django {django.get_version()}")
          PY

      - name: Export verified image and portable manifest
        id: export-image
        run: |
          set -euo pipefail
          image_dir="$RUNNER_TEMP/onlinepolis-image"
          mkdir -p "$image_dir"
          docker image save "$IMAGE_REF" | gzip -1 -n > "$image_dir/image.tar.gz"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "onlinepolis-image"
          image_ref = os.environ["IMAGE_REF"]
          revision = os.environ["GITHUB_SHA"]
          build = json.loads((root.parent / "image-build.json").read_text())
          image = json.loads(subprocess.check_output(["docker", "image", "inspect", image_ref]))[0]
          with tarfile.open(root / "image.tar.gz", "r:gz") as archive:
              entries = json.load(archive.extractfile("manifest.json"))
              require(len(entries) == 1 and entries[0]["RepoTags"] == [image_ref], "Unexpected saved image tag")
              config_blob = archive.extractfile(entries[0]["Config"]).read()
          config = json.loads(config_blob)
          config_digest = "sha256:" + hashlib.sha256(config_blob).hexdigest()
          # Exporter metadata varies by Buildx driver. The saved config's hash
          # is portable; prove its filesystem and runtime config match the
          # exact local image that passed the Python, Redis and PostgreSQL checks.
          build_config_digest = build.get("containerimage.config.digest")
          require(not build_config_digest or config_digest == build_config_digest, "Build/export config digest mismatch")
          require(config["rootfs"]["diff_ids"] == image["RootFS"]["Layers"], "Saved filesystem differs from tested image")
          def runtime_value(runtime_config, key):
              value = runtime_config.get(key)
              if value is not None:
                  return value
              if key in ("User", "WorkingDir", "StopSignal"):
                  return ""
              if key in ("Env", "Entrypoint", "Cmd"):
                  return []
              return {}
          for key in ("Env", "Entrypoint", "Cmd", "Labels", "User", "WorkingDir", "StopSignal", "Healthcheck", "Volumes", "ExposedPorts"):
              require(runtime_value(config["config"], key) == runtime_value(image["Config"], key), "Saved runtime config differs from tested image: " + key)
          require(config["os"] == image["Os"] == "linux" and config["architecture"] == image["Architecture"] == "amd64", "Unexpected image platform")
          require(config["config"]["Labels"]["org.opencontainers.image.revision"] == revision, "Unexpected image revision")
          metadata = {"schema": 1, "image_ref": image_ref, "revision": revision,
                      "platform": "linux/amd64", "ci_image_id": image["Id"], "config_digest": config_digest}
          (root / "manifest.json").write_text(json.dumps(metadata, indent=2) + "\n")
          with (root / "image.tar.gz").open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          (root / "image.tar.gz.sha256").write_text(digest + "  image.tar.gz\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image-ref={image_ref}\nconfig-digest={config_digest}\narchive-sha256={digest}\n")
              output.write(f'artifact-name=onlinepolis-image-{revision}-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          print(json.dumps(metadata, sort_keys=True))
          PY

      - name: Upload verified image artifact
        id: upload-image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.export-image.outputs.artifact-name }}
          path: ${{ runner.temp }}/onlinepolis-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  deploy:
    name: Deploy through restricted SSH controller
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.activate
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      EXPECTED_CONFIG_DIGEST: ${{ needs.build.outputs.config-digest }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download verified image artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.image-artifact-id }}
          path: ${{ runner.temp }}/onlinepolis-image/
          digest-mismatch: error

      - name: Setup restricted SSH with pinned host key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DROPLET_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT > 0 && 10#$SSH_PORT <= 65535 ))
          umask 077
          mkdir -p "$RUNNER_TEMP/onlinepolis-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/onlinepolis-ssh/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/onlinepolis-ssh/known_hosts"
          ssh-keygen -l -f "$RUNNER_TEMP/onlinepolis-ssh/known_hosts" > /dev/null
          cat > "$RUNNER_TEMP/onlinepolis-ssh/config" <<EOF
          Host onlinepolis-production
            HostName $DROPLET_HOST
            HostKeyAlias onlinepolis-production
            User onlinepolis-deploy
            Port $SSH_PORT
            IdentityFile $RUNNER_TEMP/onlinepolis-ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/onlinepolis-ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            RequestTTY no
            ClearAllForwardings yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF

      - name: Check controller and protected host configuration
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/onlinepolis-ssh/config" onlinepolis-production status > "$RUNNER_TEMP/onlinepolis-controller.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          status = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'onlinepolis-controller.json').read_text())
          if status.get('protocol') != 1:
              raise SystemExit('Unsupported deployment controller')
          protected = status.get('config_source_hashes', {})
          for name in ('docker-compose.prod.yml', 'scripts/deploy/security.override.yml', 'nginx/nginx.conf', 'nginx/default.conf'):
              expected = hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if protected.get(name) != expected:
                  raise SystemExit('Protected host configuration differs: ' + name + '; an administrator must review and install infrastructure changes first')
          print('Restricted controller and protected host configuration verified')
          PY

      - name: Upload the verified application image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/onlinepolis-image"
          printf '%s  image.tar.gz\n' "$EXPECTED_ARCHIVE_SHA256" | sha256sum --check -
          image_bytes=$(stat -c '%s' image.tar.gz)
          ssh -F "$RUNNER_TEMP/onlinepolis-ssh/config" onlinepolis-production \
            upload "$DEPLOYMENT_ID" "$GITHUB_SHA" "$IMAGE_REF" "$EXPECTED_CONFIG_DIGEST" "$EXPECTED_ARCHIVE_SHA256" "$image_bytes" < image.tar.gz

      - name: Activate the application image
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/onlinepolis-ssh/config" onlinepolis-production activate "$DEPLOYMENT_ID" < /dev/null

      - name: Verify running image IDs, services and HTTPS
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/onlinepolis-ssh/config" onlinepolis-production health "$DEPLOYMENT_ID" < /dev/null

      - name: Cleanup SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/onlinepolis-ssh"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [validate, test, build, deploy]
    if: always()
    steps:
      - name: Maintenance artifact ready
        if: needs.build.result == 'success' && needs.deploy.result == 'skipped'
        run: echo "Verified image is ready; production activation was explicitly deferred"
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: echo "Deployment and production health verification succeeded"
      - name: Deployment Failure
        if: needs.deploy.result == 'failure' || needs.build.result == 'failure' || needs.test.result == 'failure' || needs.validate.result == 'failure'
        run: echo "Deployment failed; inspect the controller recovery result"

  rollback:
    name: Recover through restricted controller
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
    steps:
      - name: Prepare pinned SSH for recovery
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DROPLET_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT > 0 && 10#$SSH_PORT <= 65535 ))
          umask 077
          mkdir -p "$RUNNER_TEMP/onlinepolis-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/onlinepolis-ssh/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/onlinepolis-ssh/known_hosts"
          ssh-keygen -l -f "$RUNNER_TEMP/onlinepolis-ssh/known_hosts" > /dev/null
          cat > "$RUNNER_TEMP/onlinepolis-ssh/config" <<EOF
          Host onlinepolis-production
            HostName $DROPLET_HOST
            HostKeyAlias onlinepolis-production
            User onlinepolis-deploy
            Port $SSH_PORT
            IdentityFile $RUNNER_TEMP/onlinepolis-ssh/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RUNNER_TEMP/onlinepolis-ssh/known_hosts
            GlobalKnownHostsFile /dev/null
            RequestTTY no
            ClearAllForwardings yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
      - name: Restore saved images without changing the database schema
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/onlinepolis-ssh/config" onlinepolis-production rollback "$DEPLOYMENT_ID" < /dev/null
      - name: Cleanup SSH material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/onlinepolis-ssh"
      - name: Report failed deployment
        run: exit 1
