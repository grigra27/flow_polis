# Main Nginx configuration file
# This file provides global settings for the Nginx server.
# Mounted over /etc/nginx/nginx.conf by docker-compose.prod.yml (H-15) —
# before that the image's default nginx.conf was used and this file was dead.

user nginx;
worker_processes auto;
# stderr — для `docker logs`; файл в ./logs/nginx/ — переживает пересоздание
# контейнера при деплое (ротация: scripts/setup-logrotate.sh).
error_log /dev/stderr warn;
error_log /var/log/nginx/persist/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $host — чтобы отличать запросы к polis.insflow.ru от www/IP/чужих Host
    # (H-01, H-15); $request_time — время ответа в секундах.
    # The first request from ZS carries a single-use credential in its query string.
    map $uri $logged_request {
        default $request;
        /flow/from-zs/ "$request_method $uri $server_protocol";
    }
    map $http_referer $logged_referer {
        default $http_referer;
        ~*/flow/from-zs/ "-";
    }
    log_format main '$remote_addr - $remote_user [$time_local] "$host" "$logged_request" '
                    '$status $body_bytes_sent "$logged_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';

    access_log /dev/stdout main;
    access_log /var/log/nginx/persist/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
